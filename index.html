
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brainrot Boost</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#100d1b;color:white;font-family:Arial,sans-serif}
header{display:flex;justify-content:space-between;align-items:center;padding:18px}
button{border:0;border-radius:12px;padding:12px;color:white;background:#792cff;font-size:15px}
.logo{font-size:21px;font-weight:bold;color:#c69aff}
.balance{background:#241a39;padding:10px 14px;border-radius:12px}
main{padding:16px}
h2{margin-top:12px}
.subtitle{color:#aaa}
.free{margin:20px 0;padding:20px;background:linear-gradient(135deg,#5422a5,#21133e);border-radius:18px;text-align:center}
.free h2{margin-top:0}
.cases{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.case{background:#211a30;border-radius:16px;padding:16px;text-align:center}
.case .emoji{font-size:48px;margin:12px}
.case p{color:#aaa;font-size:13px}
.case button{width:100%}
#result{margin-top:18px;text-align:center;font-size:19px}
#timer{color:#d2b5ff;margin:12px}
#menu{display:none;background:#1d1630;padding:20px}
#menu button{display:block;width:100%;margin:8px 0;text-align:left;background:#302247}
footer{text-align:center;color:#777;padding:25px;font-size:12px}
</style>
</head>
<body>
<header>
<button onclick="toggleMenu()">☰</button>
<div class="logo">BRAINROT BOOST</div>
<div class="balance">🪙 <span id="coins">0</span></div>
</header>

<div id="menu">
<button onclick="home()">🏠 Главная</button>
<button onclick="alert('Коллекция появится позже')">🧠 Коллекция</button>
<button onclick="alert('Улучшения появятся позже')">⚡ Апгрейд</button>
<button onclick="alert('Профиль появится позже')">👤 Профиль</button>
</div>

<main>
<h2>Привет, игрок! 👋</h2>
<p class="subtitle">Добро пожаловать в мир Brainrot!</p>

<section class="free">
<h2>🎁 Бесплатный кейс</h2>
<p>Получай нового Brainrot каждые 12 часов!</p>
<div id="timer"></div>
<button id="openFree" onclick="openFreeCase()">ОТКРЫТЬ КЕЙС</button>
<div id="result"></div>
</section>

<h2>📦 Наши кейсы</h2>
<div class="cases">
<div class="case">
<div class="emoji">🧠</div>
<b>Brainrot Case</b>
<p>Обычные и редкие персонажи</p>
<button onclick="alert('Скоро!')">Скоро</button>
</div>
<div class="case">
<div class="emoji">👑</div>
<b>Legendary Case</b>
<p>Коллекция легенд</p>
<button onclick="alert('Скоро!')">Скоро</button>
</div>
</div>
</main>

<footer>Brainrot Boost © 2026</footer>

<script>
let coins = Number(localStorage.getItem("bb_coins") || 0);
let lastOpen = Number(localStorage.getItem("bb_last_open") || 0);
const drops = [
["Tralalero Tralala","Обычный","🐟"],
["Bombardiro Crocodilo","Редкий","🐊"],
["Ballerina Cappuccina","Эпический","☕"],
["Tung Tung Tung Sahur","Легендарный","🥁"]
];

function update(){
 document.getElementById("coins").textContent=coins;
 let left=12*60*60*1000-(Date.now()-lastOpen);
 let btn=document.getElementById("openFree");
 if(left<=0){
  document.getElementById("timer").textContent="Кейс готов!";
  btn.disabled=false;
  btn.textContent="ОТКРЫТЬ КЕЙС";
 }else{
  let h=Math.floor(left/3600000);
  let m=Math.floor(left%3600000/60000);
  let s=Math.floor(left%60000/1000);
  document.getElementById("timer").textContent=
   "Следующий кейс через "+h+"ч "+m+"м "+s+"с";
  btn.disabled=true;
  btn.textContent="ПОКА НЕДОСТУПНО";
 }
}
function openFreeCase(){
 if(Date.now()-lastOpen<12*60*60*1000)return;
 let drop=drops[Math.floor(Math.random()*drops.length)];
 lastOpen=Date.now();
 coins+=100;
 localStorage.setItem("bb_last_open",lastOpen);
 localStorage.setItem("bb_coins",coins);
 document.getElementById("result").innerHTML=
  drop[2]+"<br><b>"+drop[0]+"</b><br>Редкость: "+drop[1]+"<br>+100 🪙";
 update();
}
function toggleMenu(){
 let m=document.getElementById("menu");
 m.style.display=m.style.display==="block"?"none":"block";
}
function home(){document.getElementById("menu").style.display="none";}
update();
setInterval(update,1000);
</script>
</body>
</html>
